<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作問ラボ</title>
<script>
// =====================================================================
//  ★ 設定：GASの「ウェブアプリのURL」を '' の間に貼ってください
//    （空のままだと「デモモード」：この端末の中だけで動きます）
// =====================================================================
var GAS_URL = '';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f2e8; --card:#fffdf8; --sheet:#ffffff;
  --ink:#1c2541; --sub:#545c72; --mute:#878b97; --line:#e3dccb; --line2:#cdc4ae;
  --navy:#22345c; --navy2:#2f4a7f; --accent:#2b5d91;
  --red:#c2382b; --red-soft:#fbe9e5; --green:#2c7652; --green-soft:#e4f2ea; --amber:#9c6614; --amber-soft:#faefd8; --blue-soft:#e8eef7;
  --r:12px; --shadow:0 1px 2px rgba(28,37,65,.06),0 4px 14px rgba(28,37,65,.06);
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  background-image:radial-gradient(rgba(34,52,92,.035) 1px,transparent 1px);background-size:18px 18px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:var(--serif)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.wide .wrap,.wrap.wide{max-width:1180px}
[hidden]{display:none!important}

/* header */
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,242,232,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.seal{display:inline-grid;place-items:center;width:34px;height:34px;flex:none;border:2px solid var(--red);color:var(--red);border-radius:6px;font-family:var(--serif);font-weight:700;font-size:20px;line-height:1;transform:rotate(-4deg);background:#fff8f5}
.seal.big{width:64px;height:64px;font-size:38px;border-width:3px;border-radius:10px}
.brand b{font-size:18px;letter-spacing:.06em;white-space:nowrap}
.brand small{display:block;color:var(--sub);font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);min-width:0}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-bar{background:var(--amber-soft);border-bottom:1px solid #ecd9ae;color:#6b4a10;font-size:13px}
.demo-bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,transform .05s}
.btn:hover{background:var(--navy2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--card);color:var(--navy);border-color:var(--line2)}
.btn.ghost:hover{background:#fff;border-color:var(--navy)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.green:hover{background:#246446}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.redline{background:var(--card);color:var(--red);border-color:#e7b9b2}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px;border-radius:8px}
.btn small{font-weight:500;opacity:.8;font-size:12px}
.link{background:none;border:0;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;min-width:36px;min-height:36px;cursor:pointer;color:var(--sub)}
.iconbtn:hover{border-color:var(--line2);background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* forms */
label.f{display:block;margin:12px 0}
.lbl{display:block;font-size:13.5px;font-weight:700;color:var(--sub);margin-bottom:6px;letter-spacing:.02em}
.lbl small{font-weight:500;color:var(--mute);margin-left:6px}
input[type=text],input[type=number],input[type=password],input:not([type]),select,textarea{width:100%;border:1px solid var(--line2);border-radius:9px;background:#fff;padding:9px 12px;min-height:44px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{min-height:88px;resize:vertical;line-height:1.75}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,93,145,.15)}
input[type=number]{width:auto;max-width:110px}
.hint{font-size:13px;color:var(--mute);margin:4px 0 0}
.hint code,.code{font-family:ui-monospace,Menlo,monospace;background:#f1ece0;border-radius:4px;padding:0 4px;color:var(--ink);font-size:12.5px}
.count{font-size:12.5px;color:var(--mute);text-align:right;margin-top:2px}
.count.over{color:var(--red);font-weight:700}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--sub);white-space:nowrap;line-height:1.6}
.chip.field{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.gray{background:#f0ede6}
.chip.green{background:var(--green-soft);border-color:#b9dcc8;color:var(--green)}
.chip.red{background:var(--red-soft);border-color:#efc1b9;color:var(--red)}
.chip.amber{background:var(--amber-soft);border-color:#ead39f;color:var(--amber)}
.chip.blue{background:var(--blue-soft);border-color:#c9d6ea;color:var(--accent)}
.chip.must{background:var(--red);border-color:var(--red);color:#fff}
.chip.suggest{background:var(--blue-soft);border-color:#c9d6ea;color:var(--accent)}
.pick{cursor:pointer;min-height:38px;padding:6px 14px;font-size:14px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink)}
.pick.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pick:hover:not(.on){border-color:var(--navy)}

/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 10px;font-size:17px}
.page{padding:20px 0 120px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:4px 0 18px}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--sub);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--navy);border-color:var(--red)}
.back{display:inline-block;margin:0 0 8px;color:var(--sub);text-decoration:none;font-size:14px}
.back:hover{color:var(--navy)}
h1,h2{line-height:1.35}
h2{font-size:22px;margin:0}
.muted{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 16px;border:1.5px dashed var(--line2);border-radius:var(--r);background:rgba(255,255,255,.4)}
.banner{border-radius:var(--r);padding:12px 16px;margin:12px 0;border:1px solid}
.banner.red{background:var(--red-soft);border-color:#efc1b9}
.banner.amber{background:var(--amber-soft);border-color:#ead39f}
.banner.green{background:var(--green-soft);border-color:#b9dcc8}
.banner.blue{background:var(--blue-soft);border-color:#c9d6ea}
.banner b{display:block;margin-bottom:2px}
.two{display:grid;gap:20px}
@media (min-width:1000px){.two{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.two>aside{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto;overscroll-behavior:contain;border-radius:var(--r)}.page-ed .two>aside{max-height:calc(100vh - 200px)}}

/* login */
.login{max-width:440px;margin:36px auto;text-align:center;padding:30px 26px}
.login h1{margin:14px 0 0;font-size:28px;letter-spacing:.08em}
.login .sub{margin:2px 0 12px;color:var(--sub)}
.login .intro{font-size:14.5px;color:var(--sub);margin:0 0 16px}
.login form{text-align:left}
.login .btn{width:100%;margin-top:8px}
.note{font-size:12.5px;color:var(--mute);margin-top:12px;text-align:left}
.teacher-door{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);text-align:center}
.teacher-door .btn{width:auto;margin:0}
.pagefoot{text-align:center;font-size:13px;padding:0 0 28px;margin-top:-80px}
.pagefoot a{color:var(--mute)}
body:has(.actionbar) .pagefoot,body:has(.login) .pagefoot{display:none}

/* browse */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filters select{width:auto;min-height:40px;padding:6px 10px;font-size:14px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);cursor:pointer;min-height:40px}
.check input{width:18px;height:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pcard{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;overflow:hidden}
.pcard:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 2px 4px rgba(28,37,65,.06),0 10px 24px rgba(28,37,65,.09)}
.pcard h3{font-family:var(--serif);font-size:19px;margin:2px 0 0;line-height:1.4}
.pc-meta{font-size:13px;color:var(--sub)}
.pc-formats{font-size:12.5px;color:var(--mute)}
.pc-foot{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--sub);margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.pc-foot span{white-space:nowrap}
.pc-cta{margin-left:auto;font-weight:700;color:var(--navy)}
.pc-cta.done{color:var(--red)}
.pc-own{position:absolute;top:12px;right:-30px;transform:rotate(35deg);background:var(--red);color:#fff;font-size:11px;padding:2px 34px}
.mcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);margin-bottom:10px}
.mcard:hover{border-color:var(--line2)}
.mcard h3{margin:0;font-family:var(--serif);font-size:18px}
.mcard .meta{grid-column:1/-1;font-size:13px;color:var(--sub)}
.mine-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}

/* stepper */
.steps{display:flex;gap:0;margin:12px 0 4px;counter-reset:st;overflow-x:auto}
.steps li{list-style:none;flex:1;min-width:84px;position:relative;text-align:center;font-size:12.5px;color:var(--mute);padding-top:30px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:var(--paper);display:grid;place-items:center;font-weight:700;font-size:13px;z-index:1;line-height:22px}
.steps li::after{content:"";position:absolute;top:12px;left:-50%;width:100%;height:2px;background:var(--line2)}
.steps li:first-child::after{display:none}
.steps li.done{color:var(--sub)}
.steps li.done::before{background:var(--navy);border-color:var(--navy);color:#fff;content:"✓"}
.steps li.done::after,.steps li.now::after{background:var(--navy)}
.steps li.now{color:var(--red);font-weight:700}
.steps li.now::before{border-color:var(--red);color:var(--red);background:#fff}
.steps{padding:0;margin-left:0}

/* editor */
.ed-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ed-head h2{font-family:var(--serif)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.sec>h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:17px}
.secno{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:15px;flex:none}
.qcard{border:1px solid var(--line2);border-radius:var(--r);background:#fff;padding:14px 16px;margin:0 0 14px;scroll-margin-top:84px}
.qcard.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px rgba(194,56,43,.35)}100%{box-shadow:none}}
.qc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.qno{display:inline-block;border:1.5px solid var(--ink);padding:0 10px;font-family:var(--serif);font-weight:700;font-size:17px;border-radius:3px;background:#fff}
.pts{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}
.pts input{width:72px;min-height:38px;text-align:center}
.qc-tools{margin-left:auto;display:flex;gap:2px}
.qcard .field{margin:12px 0}
.ch-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ch-mark{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;font-weight:700;cursor:pointer;color:var(--sub);font-size:16px}
.ch-row.ok .ch-mark{border-color:var(--red);background:var(--red);color:#fff;box-shadow:0 0 0 3px rgba(194,56,43,.18)}
.ch-row.ok input{border-color:#e6aaa1;background:#fffaf9}
.bl-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
@media (max-width:560px){.bl-row{grid-template-columns:auto 1fr}.bl-row input:last-child{grid-column:2}}
.blank{display:inline-block;min-width:2.6em;padding:0 .45em;border:1.5px solid currentColor;text-align:center;line-height:1.5;margin:0 .15em;font-family:var(--sans);font-size:.88em;font-weight:700;border-radius:2px;background:#fff}
u.ul{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.imgs-ed{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:8px}
.img-ed{border:1px solid var(--line2);border-radius:10px;padding:8px;background:#fafaf7;position:relative}
.img-ed img{width:100%;height:140px;object-fit:contain;background:#fff;border-radius:6px;display:block;cursor:zoom-in}
.img-ed input{margin-top:6px;min-height:38px;font-size:13.5px}
.img-ed .iconbtn{position:absolute;top:4px;right:4px;background:#fff;border-color:var(--line2)}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:100px}
.qc-issues{margin:0 0 10px;display:grid;gap:6px}
.qc-iss{border-left:3px solid var(--accent);background:var(--blue-soft);padding:8px 10px;border-radius:0 8px 8px 0;font-size:14px}
.qc-iss.must{border-color:var(--red);background:var(--red-soft)}
.qc-iss p{margin:2px 0 0}
.qc-iss .old{font-size:12px;color:var(--mute)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,253,248,.97);border-top:1px solid var(--line2);box-shadow:0 -6px 18px rgba(28,37,65,.08);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.actionbar .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ab-info{display:flex;flex-direction:column;line-height:1.35;font-size:14px}
.ab-info .tot b{font-size:18px}
.ab-info .tot.off b{color:var(--amber)}
.ab-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ab-hint{flex-basis:100%;font-size:13px;color:var(--sub);text-align:right;margin-top:-2px}
.ab-hint.good{color:var(--green);font-weight:700}
@media (max-width:640px){.actionbar{padding-top:8px}.ab-info{flex-direction:row;gap:10px;align-items:baseline;font-size:13px}.ab-btns{width:100%;margin-left:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.ab-btns .btn{padding:6px 4px;font-size:13.5px;min-height:42px}.ab-btns .btn small{display:none}.ab-hint{text-align:left;font-size:12.5px}
  .demo-bar{font-size:12px}.demo-bar .wrap{gap:2px 8px;padding-top:4px;padding-bottom:4px;line-height:1.5}
  .steps li{min-width:60px;font-size:11px}.page{padding-top:14px}}

/* review */
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.rv h3{margin:0;font-size:16px}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.stamp{display:inline-block;font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.15em;padding:2px 10px 2px 14px;border:3px double currentColor;border-radius:8px;transform:rotate(-6deg)}
.stamp.pass{color:var(--green)}
.stamp.revise{color:var(--red)}
.asp-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13.5px;margin:4px 0}
.dots{display:flex;gap:3px}
.dots i{width:16px;height:8px;border-radius:2px;background:#e9e4d8}
.dots.s5 i,.dots.s4 i{--c:var(--green)}
.dots.s3 i{--c:#c99323}
.dots.s2 i,.dots.s1 i{--c:var(--red)}
.dots i.on{background:var(--c)}
.rv-total{text-align:right;font-size:13px;color:var(--sub);margin-top:4px}
.rv-sum{font-size:14.5px;background:#f6f3ec;border-radius:8px;padding:10px 12px;margin:12px 0}
.rv h4{font-size:13.5px;margin:14px 0 6px;color:var(--sub)}
.rv ul{margin:0;padding-left:1.2em;font-size:14px}
.iss{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;font-size:14px}
.iss.must{border-color:#efc1b9;background:#fffaf8}
.iss-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.iss-h .asp{font-size:12px;color:var(--mute)}
.iss p{margin:6px 0 0}
.iss .adv{color:var(--sub)}
.iss .adv::before{content:"ヒント ";font-weight:700;color:var(--amber);font-size:12px}
.rv-meta{font-size:12px;color:var(--mute);margin-top:10px;text-align:right}
.warn{font-size:13.5px;background:var(--amber-soft);border:1px solid #ead39f;border-radius:8px;padding:8px 10px;color:#6b4a10}
.hist{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.hist span{font-size:11.5px;padding:1px 6px;border-radius:4px;background:#f0ede6;color:var(--sub)}
.hist span.pass{background:var(--green-soft);color:var(--green)}
.hist span.revise{background:var(--red-soft);color:var(--red)}

/* paper (problem sheet) */
.paper{background:var(--sheet);border:1px solid var(--line2);border-radius:6px;padding:26px 26px 30px;box-shadow:0 1px 0 #e7e1d2,0 8px 24px rgba(28,37,65,.07);position:relative}
.paper-head{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.ph-field{font-size:12.5px;color:var(--sub);letter-spacing:.12em}
.paper-head h2{font-family:var(--serif);font-size:24px;margin:2px 0}
.ph-meta{font-size:13px;color:var(--sub)}
.lead{font-family:var(--serif);font-size:16.5px;white-space:pre-wrap;line-height:1.95;margin:0 0 12px;padding:12px 14px;border:1px solid var(--line2);border-radius:4px;background:#fffefb}
.pq{position:relative;padding:16px 0 18px;border-bottom:1px dashed var(--line2)}
.pq:last-child{border-bottom:0}
.pq-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.pq-fmt{font-size:12px;color:var(--mute)}
.pq-pts{font-size:13px;color:var(--sub);margin-left:auto}
.pq-text{font-family:var(--serif);font-size:16.5px;white-space:pre-wrap;line-height:1.95}
.fig{margin:12px 0;text-align:center}
.fig img{max-width:100%;max-height:520px;border:1px solid var(--line);border-radius:4px;cursor:zoom-in;background:#fff}
.fig figcaption{font-size:13px;color:var(--sub);margin-top:4px}
.pq-choices{display:grid;gap:6px;margin-top:10px}
.pc-opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;position:relative}
label.pc-opt{cursor:pointer;min-height:48px;align-items:center}
label.pc-opt:hover{border-color:var(--line2);background:#fdfcf8}
label.pc-opt:has(input:checked){border-color:var(--navy);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--navy)}
.pc-opt input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--navy)}
.pc-opt .lab{font-weight:700;min-width:1.6em;flex:none}
.pc-opt.is-ans{border-color:#e8b0a7}
.pc-opt.is-ans .lab{color:#fff;background:var(--red);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;min-width:26px;font-size:14px}
.pc-opt.is-given::after{content:"あなた";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;color:var(--navy);background:var(--blue-soft);border:1px solid #c9d6ea;border-radius:999px;padding:0 8px}
.pc-opt.is-given.is-ans::after{color:var(--red);background:var(--red-soft);border-color:#efc1b9}
.pq-blanks{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.bl-in{display:flex;align-items:center;gap:6px}
.bl-in input{width:200px;max-width:60vw}
.essay-in{margin-top:10px;font-family:var(--serif);font-size:16px}
.pq-ans{margin-top:12px;background:#fbf7ee;border:1px solid #ece2c9;border-radius:8px;padding:10px 14px;font-size:14.5px}
.pq-ans .lbl{display:inline-block;margin:0 6px 0 0;color:var(--red);font-size:12.5px}
.pq-ans p{margin:2px 0 8px;white-space:pre-wrap}
.pq-ans>div:last-child p{margin-bottom:0}
.yours{margin-top:10px;font-size:14.5px;display:grid;gap:4px}
.yours .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ok-t{color:var(--green);font-weight:700}
.ng-t{color:var(--red);font-weight:700}
.essay-box{white-space:pre-wrap;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:8px 12px;font-family:var(--serif)}
.mark{position:absolute;top:4px;left:-14px;width:86px;height:60px;color:var(--red);pointer-events:none;opacity:.88}
.mark svg{width:100%;height:100%;overflow:visible}
.pq-pts.got{color:var(--red);font-weight:700;font-size:14.5px}
.self{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;padding:10px;border:1px dashed #e8b0a7;border-radius:8px;background:#fffaf8}
.self .pick.on{background:var(--red);border-color:var(--red)}
.ingenuity{margin-top:18px;padding:12px 14px;border-left:4px solid var(--navy);background:var(--blue-soft);border-radius:0 8px 8px 0;font-size:14.5px}
.ingenuity p{margin:4px 0 0;white-space:pre-wrap}
.scorebig{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score-circle{width:120px;height:120px;border:3px solid var(--red);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--red);font-family:var(--serif);transform:rotate(-6deg);background:#fff;flex:none}
.score-circle b{font-size:42px;line-height:1.05}
.score-circle span{font-size:14px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:32px;line-height:1;cursor:pointer;color:#d8d1c0;padding:2px}
.stars button.on{color:#e0a321}

/* stats */
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-family:var(--serif);line-height:1.2}
.kpi span{font-size:12.5px;color:var(--sub)}
.qstat{padding:10px 0;border-top:1px dashed var(--line)}
.qstat-h{display:flex;gap:8px;align-items:center;font-size:14px}
.bar{height:10px;border-radius:5px;background:#ece7db;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--navy);border-radius:5px}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:13px;margin-top:6px}
.dist .bar i{background:#9aa6bf}
.dist .ans .bar i{background:var(--red)}
.dist .ans{color:var(--red);font-weight:700}
.dist>div{display:contents}
.fb{border-top:1px dashed var(--line);padding:10px 0;font-size:14.5px}
.fb.rep{background:var(--red-soft);border:1px solid #efc1b9;border-radius:8px;padding:10px 12px;margin:6px 0}
.fb .st{color:#e0a321;letter-spacing:1px}

/* teacher */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
table.tt{border-collapse:collapse;width:100%;font-size:14px;min-width:900px}
.tt th,.tt td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tt th{background:#f3efe4;font-size:12.5px;color:var(--sub);position:sticky;top:0}
.tt td.t{white-space:normal;min-width:180px;font-family:var(--serif);font-weight:700}
.tt tr.click{cursor:pointer}
.tt tr.click:hover td{background:#fffaf0}
.tt td.n{text-align:right;font-variant-numeric:tabular-nums}
.gradebtns .pick{min-width:52px}

/* modal / toast / busy */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(20,26,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
.modal{background:var(--card);border-radius:14px;width:min(560px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
.modal.wide{width:min(900px,100%)}
.modal h3{margin:0 0 12px;font-size:18px;padding-right:40px}
.modal .x{position:absolute;top:10px;right:10px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.lightbox{background:transparent;box-shadow:none;width:auto;max-width:100%;padding:0}
.lightbox img{max-width:96vw;max-height:88vh;background:#fff;border-radius:6px;display:block}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(520px,calc(100% - 24px))}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s}
.toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#busy{position:fixed;inset:0;z-index:90;background:rgba(246,242,232,.82);display:grid;place-items:center;backdrop-filter:blur(2px)}
.busy-box{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:22px 26px;text-align:center;box-shadow:var(--shadow);max-width:360px;margin:16px}
.spin{width:44px;height:44px;margin:0 auto 12px;border:4px solid #e8e2d3;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy-tip{font-size:13px;color:var(--sub);margin-top:8px;min-height:2.6em}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)}
.qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:10px}
details.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:14px 0}
details.box summary{cursor:pointer;font-weight:700}
.setgrid{display:grid;gap:4px 16px}
@media (min-width:640px){.setgrid{grid-template-columns:1fr 1fr}}
.toggle{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.toggle input{width:20px;height:20px}
@media (max-width:560px){.paper{padding:18px 14px 22px}.card,.sec{padding:14px}}
@media print{.topbar,.actionbar,.demo-bar,.back,.no-print{display:none!important}body{background:#fff}.paper{box-shadow:none;border:0}}
</style>
</head>
<body>
<div id="demo-bar" class="demo-bar" hidden></div>
<header class="topbar"><div class="wrap" id="topbar"></div></header>
<main id="app" class="wrap"></main>
<footer class="pagefoot no-print"><div class="wrap" id="pagefoot"></div></footer>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<div id="busy" hidden><div class="busy-box"><div class="spin"></div><div id="busy-msg">処理中…</div><div class="busy-tip" id="busy-tip"></div></div></div>

<script>
// ===== 作問ラボ 共通ロジック（画面のデモモードとGASで同じものを使います） =====
var CORE = (function () {
  'use strict';

  var FORMATS = [
    { key: 'blank', label: '空欄補充', type: 'blank' },
    { key: 'choice', label: '記号選択問題', type: 'choice' },
    { key: 'combo', label: '組み合わせ問題', type: 'choice' },
    { key: 'truefalse', label: '正誤判定文章問題', type: 'choice' },
    { key: 'essay', label: '論述問題', type: 'essay' },
    { key: 'other', label: 'その他', type: null }
  ];
  var FORMAT_KEYS = FORMATS.map(function (f) { return f.key; });
  var ANS_TYPES = { choice: '選択肢から選ぶ', blank: 'ことば（語句）を書く', essay: '文章で書く' };
  var LABEL_STYLES = {
    num: ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'],
    kana: ['ア', 'イ', 'ウ', 'エ', 'オ', 'カ', 'キ', 'ク'],
    alpha: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'],
    digit: ['1', '2', '3', '4', '5', '6', '7', '8']
  };
  var ASPECTS = [
    { key: 'accuracy', label: '史実の正確さ' },
    { key: 'uniqueness', label: '正解が一つに決まる' },
    { key: 'clarity', label: '問題文のわかりやすさ' },
    { key: 'explanation', label: '解説の充実' },
    { key: 'thinking', label: '思考力・資料の活用' }
  ];
  var ASPECT_KEYS = ASPECTS.map(function (a) { return a.key; });
  var STATUS = {
    draft: { label: '下書き', tone: 'gray' },
    returned: { label: '差し戻し', tone: 'red' },
    pending: { label: '先生の確認待ち', tone: 'amber' },
    published: { label: '公開中', tone: 'green' }
  };
  var LIMITS = { title: 60, short: 200, text: 3000, lead: 4000, choice: 300, expl: 3000, note: 1000, maxQ: 8, minChoices: 2, maxChoices: 8, maxImg: 2, maxBlanks: 8, maxProblemsPerStudent: 5 };
  var TARGET_POINTS = 25;

  var DEFAULT_SETTINGS = {
    appTitle: '作問ラボ',
    subtitle: '世界史探究 オリジナル問題',
    classes: ['2-3', '2-4', '2-5', '2-6・7'],
    fields: ['歴史総合', '古代オリエント', '古代ギリシア', '古代ローマ', '中国史'],
    genres: ['政治・制度', '戦争・外交', '社会・経済', '文化・宗教', '資料・地図の読み取り'],
    requireApproval: false, // true：AI合格のあとも先生の承認が必要
    scope: 'class',         // 'class'：同じクラスだけ／'all'：全クラスで共有
    showAuthor: true,
    open: true,             // 作問（新規作成）の受付
    maxChecks: 15,          // 1つの大問あたりのAIチェック回数の上限
    dailyAiLimit: 400,      // 1日あたりのAI呼び出し回数の上限（全体）
    aiEssay: true,          // 論述のAI採点
    aiNote: ''              // AIへの追加の指示
  };

  // ---------- 小さな道具 ----------
  function str(v, max) { v = v == null ? '' : String(v); return max && v.length > max ? v.slice(0, max) : v; }
  function int(v, lo, hi, def) { var n = Math.round(Number(v)); if (!isFinite(n)) n = def; return Math.max(lo, Math.min(hi, n)); }
  function num(v, lo, hi, def) { var n = Number(v); if (!isFinite(n)) n = def; return Math.max(lo, Math.min(hi, n)); }
  function round1(n) { return Math.round(n * 10) / 10; }
  function list(v, max, each) { return (Array.isArray(v) ? v : []).slice(0, max).map(each); }
  function uniq(a) { var s = {}, out = []; a.forEach(function (x) { if (!s[x]) { s[x] = 1; out.push(x); } }); return out; }

  function formatInfo(key) { for (var i = 0; i < FORMATS.length; i++) if (FORMATS[i].key === key) return FORMATS[i]; return FORMATS[5]; }
  function answerType(q) { var t = formatInfo(q.format).type; if (t) return t; return ANS_TYPES[q.ansType] ? q.ansType : 'choice'; }
  function formatLabel(q) { return q.format === 'other' ? 'その他' + (q.formatOther ? '（' + q.formatOther + '）' : '') : formatInfo(q.format).label; }
  function labelsOf(q) { return LABEL_STYLES[q.choiceStyle] || LABEL_STYLES.num; }
  function fieldName(c) { return c.field === 'その他' ? (c.fieldOther || 'その他') : (c.field || ''); }
  function totalPoints(c) { return round1(c.questions.reduce(function (s, q) { return s + (Number(q.points) || 0); }, 0)); }

  // 問題文中の {{ア}} を空欄とみなす
  function blankLabels(text) {
    var re = /\{\{\s*([^{}\n]{1,8}?)\s*\}\}/g, m, out = [];
    while ((m = re.exec(String(text || '')))) out.push(m[1]);
    return uniq(out).slice(0, LIMITS.maxBlanks);
  }
  function syncBlanks(q) {
    var labels = blankLabels(q.text);
    if (!labels.length) labels = ['答'];
    var old = {}; (q.blanks || []).forEach(function (b) { old[b.label] = b; });
    var prev = q.blanks || [];
    q.blanks = labels.map(function (l, i) {
      var b = old[l];
      // 記号だけ書きかえた場合（ア→a など）は、同じ位置の答えを引きつぐ
      if (!b && prev.length === labels.length && prev[i] && labels.indexOf(prev[i].label) < 0) b = prev[i];
      return { label: l, answer: b ? str(b.answer, LIMITS.short) : '', alts: b ? str(b.alts, LIMITS.short) : '' };
    });
    return q;
  }

  function newQuestion(format) {
    return { format: format || 'choice', formatOther: '', ansType: '', points: 5, text: '', images: [], choiceStyle: 'num', choices: ['', '', '', ''], answerIndex: -1, blanks: [], modelAnswer: '', criteria: '', charLimit: 0, explanation: '' };
  }
  function newContent() {
    return { title: '', field: '', fieldOther: '', genres: [], plan: '', lead: '', leadImages: [], questions: [newQuestion(), newQuestion(), newQuestion(), newQuestion(), newQuestion()], ingenuity: '' };
  }
  function normImages(arr) {
    return list(arr, LIMITS.maxImg, function (x) { return x && x.id ? { id: str(x.id, 200), caption: str(x.caption, LIMITS.short) } : null; }).filter(Boolean);
  }
  // 受け取った内容を決まった形に整える（キーの順番も固定 → ハッシュが安定する）
  function normalizeContent(c) {
    c = c || {};
    var out = {
      title: str(c.title, LIMITS.title).trim(),
      field: str(c.field, 40),
      fieldOther: str(c.fieldOther, 40),
      genres: list(c.genres, 8, function (g) { return str(g, 40); }).filter(Boolean),
      plan: str(c.plan, LIMITS.text),
      lead: str(c.lead, LIMITS.lead),
      leadImages: normImages(c.leadImages),
      questions: list(c.questions, LIMITS.maxQ, normQuestion),
      ingenuity: str(c.ingenuity, LIMITS.text)
    };
    if (!out.questions.length) out.questions.push(newQuestion());
    return out;
  }
  function normQuestion(q) {
    q = q || {};
    var o = newQuestion(FORMAT_KEYS.indexOf(q.format) >= 0 ? q.format : 'choice');
    o.formatOther = str(q.formatOther, 30);
    o.ansType = ANS_TYPES[q.ansType] ? q.ansType : '';
    o.points = round1(num(q.points, 0, 100, 5));
    o.text = str(q.text, LIMITS.text);
    o.images = normImages(q.images);
    o.choiceStyle = LABEL_STYLES[q.choiceStyle] ? q.choiceStyle : 'num';
    o.choices = Array.isArray(q.choices) ? q.choices.slice(0, LIMITS.maxChoices).map(function (s) { return str(s, LIMITS.choice); }) : ['', '', '', ''];
    while (o.choices.length < LIMITS.minChoices) o.choices.push('');
    o.answerIndex = int(q.answerIndex, -1, o.choices.length - 1, -1);
    o.blanks = list(q.blanks, LIMITS.maxBlanks, function (b) { b = b || {}; return { label: str(b.label, 8), answer: str(b.answer, LIMITS.short), alts: str(b.alts, LIMITS.short) }; });
    o.modelAnswer = str(q.modelAnswer, LIMITS.text);
    o.criteria = str(q.criteria, LIMITS.text);
    o.charLimit = int(q.charLimit, 0, 2000, 0);
    o.explanation = str(q.explanation, LIMITS.expl);
    if (answerType(o) === 'blank') syncBlanks(o);
    return o;
  }

  function hashContent(c) {
    var s = JSON.stringify(normalizeContent(c)), h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0; }
    return ('0000000' + h.toString(16)).slice(-8) + '-' + s.length.toString(36);
  }

  // 未記入チェック（AIチェックの前に確認する）
  function completeness(c) {
    var miss = [];
    if (!c.title.trim()) miss.push({ q: 0, msg: 'テーマ（大問のタイトル）を書こう' });
    if (!fieldName(c).trim()) miss.push({ q: 0, msg: '分野を選ぼう' });
    c.questions.forEach(function (q, i) {
      var n = i + 1, t = answerType(q), P = '問' + n + '：';
      if (!q.text.trim()) miss.push({ q: n, msg: P + '問題文がありません' });
      if (!(Number(q.points) > 0)) miss.push({ q: n, msg: P + '配点を入れよう' });
      if (t === 'choice') {
        var labels = labelsOf(q);
        q.choices.forEach(function (ch, j) { if (!ch.trim()) miss.push({ q: n, msg: P + '選択肢' + labels[j] + 'が空です（いらない行は✕で消そう）' }); });
        if (q.answerIndex < 0) miss.push({ q: n, msg: P + '正解の選択肢に印をつけよう' });
      } else if (t === 'blank') {
        q.blanks.forEach(function (b) { if (!b.answer.trim()) miss.push({ q: n, msg: P + '空欄「' + b.label + '」の正解を書こう' }); });
      } else {
        if (!q.modelAnswer.trim()) miss.push({ q: n, msg: P + '模範解答を書こう' });
      }
      if (!q.explanation.trim()) miss.push({ q: n, msg: P + '出題のねらい・解説を書こう' });
    });
    return miss;
  }

  // ---------- 採点 ----------
  function kataToHira(s) { return s.replace(/[ァ-ヶ]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x60); }); }
  function normAnswer(s) {
    s = String(s == null ? '' : s);
    if (s.normalize) s = s.normalize('NFKC');
    s = kataToHira(s.toLowerCase());
    return s.replace(/[\s　・･=＝\-‐－―ーｰ~〜,，、。.．「」『』()（）\[\]［］【】"'“”]/g, '');
  }
  function acceptable(b) {
    return [b.answer].concat(String(b.alts || '').split(/[／/、,，;；|｜]/)).map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function grade(c, answers) {
    answers = Array.isArray(answers) ? answers : [];
    return c.questions.map(function (q, i) {
      var t = answerType(q), max = Number(q.points) || 0, a = answers[i];
      if (t === 'choice') {
        var idx = (a === '' || a == null) ? -1 : int(a, -1, 99, -1);
        var ok = idx >= 0 && idx === q.answerIndex;
        return { type: t, max: max, score: ok ? max : 0, correct: ok, given: idx };
      }
      if (t === 'blank') {
        var arr = Array.isArray(a) ? a : [a];
        var given = q.blanks.map(function (b, j) { return str(arr[j], LIMITS.short); });
        var per = q.blanks.map(function (b, j) {
          var g = normAnswer(given[j]);
          return !!g && acceptable(b).some(function (x) { return normAnswer(x) === g; });
        });
        var n = per.filter(Boolean).length;
        return { type: t, max: max, score: per.length ? round1(max * n / per.length) : 0, correct: n === per.length, partial: n > 0 && n < per.length, perBlank: per, given: given };
      }
      return { type: 'essay', max: max, score: null, correct: null, given: str(a, 4000), by: '', comment: '' };
    });
  }
  function sumScore(result) { return round1(result.reduce(function (s, r) { return s + (Number(r.score) || 0); }, 0)); }

  // 解く人に渡す（答え・解説を消す）
  function stripAnswers(c) {
    var o = JSON.parse(JSON.stringify(c));
    o.plan = ''; o.ingenuity = '';
    o.questions.forEach(function (q) {
      q.answerIndex = -1; q.modelAnswer = ''; q.criteria = ''; q.explanation = '';
      q.blanks = (q.blanks || []).map(function (b) { return { label: b.label, answer: '', alts: '' }; });
    });
    return o;
  }
  function answerText(q) {
    var t = answerType(q);
    if (t === 'choice') return q.answerIndex >= 0 ? labelsOf(q)[q.answerIndex] + ' ' + (q.choices[q.answerIndex] || '') : '（未設定）';
    if (t === 'blank') return q.blanks.map(function (b) { return (q.blanks.length > 1 || b.label !== '答' ? b.label + '：' : '') + b.answer + (b.alts ? '（別解：' + b.alts + '）' : ''); }).join('　');
    return q.modelAnswer;
  }

  // ---------- 集計 ----------
  function firstAttempts(atts) {
    var by = {};

<script>

// ---------------------------------------------------------------------

const TEACHER_ACTIONS = /^t[A-Z]/;
async function api(action, payload) {
  const req = Object.assign({ action }, payload || {});
  if (TEACHER_ACTIONS.test(action)) req.pass = state.pass;

  } catch (e) { throw new Error('通信できませんでした。インターネットにつながっているか確かめて、もう一度押してください'); }

// ---------------------------------------------------------------------
//  小さな道具

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(text) {
  let s = esc(text);
  s = s.replace(/\{\{\s*([^{}\n]{1,8}?)\s*\}\}/g, '<span class="blank">$1</span>');
  s = s.replace(/__([^_\n](?:[^\n]*?[^_\n])?)__/g, '<u class="ul">$1</u>');

}

// 画像：ドライブのサムネイル → だめならGAS経由で読む
const imgCache = {};
function imgHtml(im, cls) { return `<figure class="fig ${cls || ''}"><img data-img="${esc(im.id)}" alt="${esc(im.caption || '資料画像')}">${im.caption ? `<figcaption>${esc(im.caption)}</figcaption>` : ''}</figure>`; }
function hydrateImages(root) {

function resizeImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('この画像は読み込めませんでした（JPEGやPNGの写真で試してください）')); };
    img.src = url;
  });
}

function verdictChip(x) {

const STEP_NAMES = ['書く', 'AIチェック（参考）', '見直す', '公開', 'みんなが解く'];
function stepIndex(p) {
  if (p.status === 'published') return 4;
  if (p.status === 'pending') return 3;
  if (p.status === 'returned') return 2;
  if (!p.lastCheck) return 0;
  return 2;
}
function stepper(p) {
  const k = stepIndex(p);
  return `<ol class="steps">${STEP_NAMES.map((s, i) => `<li class="${i < k ? 'done' : i === k ? 'now' : ''}">${i === 3 && p.status === 'pending' ? '先生の確認待ち' : s}</li>`).join('')}</ol>`;
}
function draftKey(id) { return 'sakumon-draft:' + (state.me ? state.me.class + '|' + state.me.number + '|' + state.me.name : '') + ':' + (id || 'new'); }

async function viewEditor(id) {
  if (state.edit && state.edit.id === id && id) return renderEditor();
  loading();
  let ed;
  try {
    if (id) {
      const r = await api('myProblem', { id });
      if (r.problem.status === 'published' || r.problem.status === 'pending') return go('#/my/' + id);
      ed = fromServer(r.problem);
    } else {
      if (!state.settings.open) { toast('いまは新しい問題の受付をしていません', true); return go('#/mine'); }
      const imp = state.importDraft;
      state.importDraft = null;
      ed = { id: null, content: imp ? imp.content : CORE.newContent(), status: 'draft', lastCheck: null, checkCount: 0, maxChecks: state.settings.maxChecks, checkHistory: [], requireApproval: state.settings.requireApproval, importNote: imp ? imp.note || '' : '', imported: !!imp, updatedAt: 0 };
      if (imp) ed.dirty = true;
    }
  } catch (e) { return failed(e, '#/mine'); }
  ed.seq = 0; ed.savedSeq = 0;
  state.edit = ed;
  // この端末に保存されていない下書きが残っていれば復元する
  const local = LS.get(draftKey(ed.id), null);
  if (local && local.at > (ed.updatedAt || 0) && CORE.hashContent(local.content) !== CORE.hashContent(ed.content) && !ed.imported) {
    renderEditor();
    if (await confirmBox('保存されていない書きかけ（' + when(local.at) + '）がこの端末に残っています。復元しますか？', '復元する')) {
      ed.content = CORE.normalizeContent(local.content); ed.dirty = true; ed.seq++;
    } else LS.del(draftKey(ed.id));
  }
  renderEditor();
  if (ed.imported) toast('読み取った内容を入れました。写真と見比べて確かめよう');
}
function fromServer(p) {
  return {
    id: p.id, content: p.content, status: p.status, lastCheck: p.lastCheck, checkCount: p.checkCount, maxChecks: p.maxChecks,
    checkHistory: p.checkHistory, requireApproval: p.requireApproval, returnNote: p.returnNote, teacherEval: p.teacherEval,
    updatedAt: p.updatedAt, version: p.version, dirty: false

}
function edPassed(ed) { return !!(ed.lastCheck && ed.lastCheck.verdict === 'pass' && ed.lastCheck.hash === CORE.hashContent(ed.content)); }
function edStale(ed) { return !!(ed.lastCheck && ed.lastCheck.hash !== CORE.hashContent(ed.content)); }

// 入力 → データに反映
function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[/^\d+$/.test(ks[i]) ? Number(ks[i]) : ks[i]];
  const last = ks[ks.length - 1];
  o[/^\d+$/.test(last) ? Number(last) : last] = val;
}
let localTimer = null, serverTimer = null, uiTimer = null;
function markDirty() {
  const ed = state.edit; if (!ed) return;
  ed.dirty = true; ed.seq++;
  clearTimeout(localTimer);
  localTimer = setTimeout(() => LS.set(draftKey(ed.id), { content: ed.content, at: Date.now() }), 500);
  clearTimeout(serverTimer);
  serverTimer = setTimeout(() => { if (state.edit === ed && ed.dirty && (ed.id || ed.content.title.trim())) saveEdit(true); }, 20000);
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => {
    if (state.edit !== ed) return;
    renderActionBar();
    const box = $('#review-box');
    if (box && ed.lastCheck && edStale(ed) && !$('.warn', box)) box.innerHTML = reviewPanel(ed.lastCheck, { stale: true, count: ed.checkCount, history: ed.checkHistory });
  }, 300);
  refreshSaveState();
}
function onBindInput(el) {
  const ed = state.edit; if (!ed) return;
  const path = el.dataset.bind;
  let v = el.value;
  if (el.dataset.num != null) v = v === '' ? 0 : Number(v);
  setPath(ed.content, path, v);
  markDirty();
  autoGrow(el);
  const m = path.match(/^questions\.(\d+)\.(text|modelAnswer|charLimit)$/);
  if (path === 'title') $('#ed-title').textContent = v || '新しい大問';
  if (m) {
    const i = Number(m[1]), q = ed.content.questions[i];
    if (m[2] === 'text' && CORE.answerType(q) === 'blank') {
      const before = q.blanks.map(b => b.label).join('|');
      CORE.syncBlanks(q);
      if (q.blanks.map(b => b.label).join('|') !== before) { $('#ans-' + i).innerHTML = answerEditor(q, i); }
    }
    if (m[2] !== 'text') { const c = $('#mcount-' + i); if (c) { c.textContent = countText(q.modelAnswer, q.charLimit); c.classList.toggle('over', q.charLimit > 0 && q.modelAnswer.replace(/\n/g, '').length > q.charLimit); } }
  }
  if (el.dataset.rerender != null) rerenderQ(path);
}
function rerenderQ(path) {
  const m = String(path).match(/^questions\.(\d+)/);
  if (!m) return renderEditor();
  const i = Number(m[1]), q = state.edit.content.questions[i];
  if (CORE.answerType(q) === 'blank') CORE.syncBlanks(q);
  const card = $('#q-' + i);
  if (card) { card.outerHTML = qcard(q, i); const nc = $('#q-' + i); hydrateImages(nc); autoGrowAll(nc); }
}
async function saveEdit(quiet) {
  const ed = state.edit;
  if (!ed || ed.saving) return;
  if (ed.status === 'pending' || ed.status === 'published') return;
  ed.saving = true; refreshSaveState();
  const seq = ed.seq;
  try {
    const r = await api('saveProblem', { id: ed.id, content: ed.content });
    const wasNew = !ed.id;
    if (wasNew) { LS.del(draftKey(null)); ed.id = r.problem.id; if (state.edit === ed) history.replaceState(null, '', '#/edit/' + ed.id); currentHash = location.hash; }
    ed.updatedAt = r.problem.updatedAt; ed.savedAt = Date.now();
    if (ed.seq === seq) { ed.dirty = false; LS.del(draftKey(ed.id)); }
    ed.imported = false;
    if (!quiet) toast('保存しました');
    if (wasNew && state.edit === ed) { const head = $('.ed-head'); if (head && !head.querySelector('.link')) head.insertAdjacentHTML('beforeend', `<a class="link" href="#/my/${ed.id}" style="font-size:14px;margin-left:auto">この問題のページ</a>`); }
    return true;
  } catch (e) { if (!quiet) toastErr(e); else toast('自動保存できませんでした：' + e.message, true); return false; }
  finally { ed.saving = false; refreshSaveState(); }
}
async function runCheck() {
  const ed = state.edit;

  if (miss.length) return showMissing(miss);
  busy('AIが問題を点検しています…（30秒〜1分ほど）', true);
  try {
    const seq = ed.seq;
    const r = await api('checkProblem', { id: ed.id, content: ed.content });
    if (!ed.id) { LS.del(draftKey(null)); history.replaceState(null, '', '#/edit/' + r.problem.id); currentHash = location.hash; }
    ed.id = r.problem.id; ed.status = r.problem.status; ed.lastCheck = r.problem.lastCheck; ed.checkCount = r.problem.checkCount;
    ed.checkHistory = r.problem.checkHistory; ed.maxChecks = r.problem.maxChecks; ed.requireApproval = r.problem.requireApproval;
    ed.updatedAt = r.problem.updatedAt; ed.savedAt = Date.now(); ed.imported = false;
    if (ed.seq === seq) { ed.dirty = false; LS.del(draftKey(ed.id)); }

function paperHtml(c, opt) {
  opt = opt || {};
  let h = `<div class="paper"><div class="paper-head"><div class="ph-field">${esc(CORE.fieldName(c))}${c.genres && c.genres.length ? '　／　' + esc(c.genres.join('・')) : ''}</div><h2>${esc(c.title || '（テーマ未入力）')}</h2><div class="ph-meta">${opt.meta ? opt.meta + '　·　' : ''}問${c.questions.length}　配点 ${n1(CORE.totalPoints(c))}点</div></div>`;
  if (c.lead.trim()) h += `<div class="lead">${fmt(c.lead)}</div>`;
  h += c.leadImages.map(im => imgHtml(im)).join('');
  c.questions.forEach((q, i) => { h += questionHtml(q, i, opt); });
  if (opt.answers && c.ingenuity && c.ingenuity.trim()) h += `<div class="ingenuity"><b>作者が工夫した点・出題のねらい</b><p>${fmt(c.ingenuity)}</p></div>`;
  return h + '</div>';
}
function questionHtml(q, i, opt) {
  const t = CORE.answerType(q), L = CORE.labelsOf(q), r = opt.result && opt.result[i];
  const pts = r ? (r.score == null ? `<span class="pq-pts got">採点待ち / ${n1(r.max)}点</span>` : `<span class="pq-pts got">${n1(r.score)} / ${n1(r.max)}点</span>`) : `<span class="pq-pts">（${n1(q.points)}点）</span>`;
  let h = `<section class="pq" id="pq-${i}"><div class="pq-head"><span class="qno">問${i + 1}</span><span class="pq-fmt">${esc(CORE.formatLabel(q))}</span>${pts}</div>`;
  if (r) h += markHtml(r);
  h += `<div class="pq-text">${fmt(q.text)}</div>` + q.images.map(im => imgHtml(im)).join('');
  if (t === 'choice') {
    h += '<div class="pq-choices">' + q.choices.map((ch, j) => {
      if (opt.mode === 'solve') return `<label class="pc-opt"><input type="radio" name="a${i}" value="${j}" data-ans="${i}"><span class="lab">${L[j]}</span><span class="serif">${fmt(ch)}</span></label>`;
      const cls = (opt.answers && j === q.answerIndex ? ' is-ans' : '') + (r && r.given === j ? ' is-given' : '');
      return `<div class="pc-opt${cls}"><span class="lab">${L[j]}</span><span class="serif">${fmt(ch)}</span></div>`;
    }).join('') + '</div>';
    if (r && r.given < 0) h += '<div class="yours"><span class="ng-t">（答えていません）</span></div>';
  } else if (t === 'blank') {
    if (opt.mode === 'solve') h += '<div class="pq-blanks">' + q.blanks.map((b, k) => `<label class="bl-in"><span class="blank">${esc(b.label)}</span><input data-ans="${i}" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="空欄${esc(b.label)}"></label>`).join('') + '</div>';
    else if (r) h += '<div class="yours">' + q.blanks.map((b, k) => `<div class="r"><span class="blank">${esc(b.label)}</span>あなた：<b>${esc(r.given[k] || '（空欄）')}</b> ${r.perBlank && r.perBlank[k] ? '<span class="ok-t">◯</span>' : '<span class="ng-t">✕</span>'}</div>`).join('') + '</div>';
  } else {
    if (opt.mode === 'solve') h += `<textarea class="essay-in" data-ans="${i}" rows="4" placeholder="${q.charLimit ? q.charLimit + '字以内' : 'ここに書こう'}"></textarea><div class="count" data-cnt="${i}" data-limit="${q.charLimit || 0}">${countText('', q.charLimit)}</div>`;
    else if (r) h += `<div class="yours"><span class="lbl" style="margin:0">あなたの答案（${String(r.given || '').replace(/\n/g, '').length}字）</span><div class="essay-box">${esc(r.given || '（空欄）')}</div></div>`;
  }
  if (opt.answers) {
    h += `<div class="pq-ans"><div><span class="lbl">${t === 'essay' ? '模範解答' : '正解'}</span>${t === 'essay' ? `<p>${esc(q.modelAnswer)}</p>` : `<b>${esc(CORE.answerText(q))}</b>`}</div>
      ${t === 'essay' && q.criteria.trim() ? `<div><span class="lbl">採点基準</span><p>${esc(q.criteria)}</p></div>` : ''}
      <div><span class="lbl">出題のねらい・解説</span><p>${fmt(q.explanation)}</p></div></div>`;
  }
  if (r && r.type === 'essay' && opt.essayUI) h += opt.essayUI(q, i, r);
  return h + '</section>';
}

    if (t === 'blank') return q.blanks.map((b, k) => { const el = $(`input[data-ans="${i}"][data-k="${k}"]`); return el ? el.value.trim() : ''; });

}
async function submitAnswers() {

async function aiEssay(i) {

function statsHtml(st, c, teacher) {
  if (!st || !st.n) return `<section class="card" style="margin-bottom:16px"><h3>解いた人の結果</h3><p class="muted">まだ解いた人はいません。</p></section>`;

      const qq = c.questions[i], L = CORE.labelsOf(qq);

      if (q.wrongTop && q.wrongTop.length) extra = `<div style="font-size:13px;color:var(--sub);margin-top:4px">よくあった誤答：${q.wrongTop.map(w => esc(w[0]) + '（' + w[1] + '人）').join('、')}</div>`;

    }).join('')}

  </section>`;
}

function openQR() {
  const url = studentUrl();
  const m = openModal(`<h3>生徒用のQRコード</h3><div class="qr" id="qr-box">読み込み中…</div><p style="text-align:center;word-break:break-all;font-size:14px"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></p><p class="hint" style="text-align:center">先生の画面のURL（最後に ?t がつくもの）は生徒に教えないでください。</p>`);
  const draw = () => { const box = $('#qr-box', m); box.innerHTML = ''; new QRCode(box, { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M }); };
  if (window.QRCode) return draw();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  sc.onload = draw;
  sc.onerror = () => { $('#qr-box', m).textContent = 'QRコードを作れませんでした（URLを直接伝えてください）'; };
  document.head.appendChild(sc);
}
function downloadCSV() {
  const head = ['クラス', '番号', '氏名', 'テーマ', '分野', '状態', 'AI判定', 'AI評価合計(25)', 'AIチェック回数', '配点合計', '解いた人数', '平均点', '★平均', '誤りの指摘', '最終更新'];
  const rows = (state.t.items || []).map(x => [x.class, x.number, x.author, x.title, x.field, (CORE.STATUS[x.status] || {}).label, x.verdict ? (x.stale ? '変更後未チェック' : x.verdict === 'pass' ? 'よし' : '要確認あり') : '', x.aiTotal == null ? '' : x.aiTotal, x.checkCount, x.totalPoints, x.n, x.avg == null ? '' : x.avg, x.ratingAvg || '', x.reports, when(x.updatedAt)]);
  const csv = '﻿' + [head].concat(rows).map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = '作問ラボ_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

const ACT = {
  closeModal: el => closeModal(el),
  logout: async () => { if (await confirmBox('ログアウトして、別の人に切りかえますか？', '切りかえる')) { if (state.edit && state.edit.dirty) await saveEdit(true); state.me = null; state.edit = null; LS.del('sakumon-me'); go('#/'); } },
  demoReset: async () => { if (await confirmBox('デモのデータを消して、見本の状態に戻しますか？', '戻す', true)) { LS.del(DEMO_KEY); demo = DEMO.create(null); state.edit = null; route(); toast('見本の状態に戻しました'); } },
  newProblem: () => { state.edit = null; state.importDraft = null; go('#/new'); },
  openImport: () => openImport(),
  // エディタ
  setField: el => { const ed = state.edit; ed.content.field = el.dataset.v; markDirty(); renderEditor(); },
  toggleGenre: el => { const g = state.edit.content.genres, v = el.dataset.v, k = g.indexOf(v); if (k >= 0) g.splice(k, 1); else g.push(v); el.classList.toggle('on'); markDirty(); },
  setFormat: el => { const i = Number(el.dataset.q), q = state.edit.content.questions[i]; q.format = el.dataset.v; if (CORE.answerType(q) === 'blank') CORE.syncBlanks(q); markDirty(); rerenderQ('questions.' + i); },
  setAns: el => { const i = Number(el.dataset.q), q = state.edit.content.questions[i]; q.answerIndex = Number(el.dataset.j); markDirty(); $('#ans-' + i).innerHTML = answerEditor(q, i); },
  addChoice: el => { const i = Number(el.dataset.q), q = state.edit.content.questions[i]; q.choices.push(''); markDirty(); $('#ans-' + i).innerHTML = answerEditor(q, i); const ins = $$('#ans-' + i + ' .ch-row input'); if (ins.length) ins[ins.length - 1].focus(); },
  delChoice: el => { const i = Number(el.dataset.q), j = Number(el.dataset.j), q = state.edit.content.questions[i]; q.choices.splice(j, 1); if (q.answerIndex === j) q.answerIndex = -1; else if (q.answerIndex > j) q.answerIndex--; markDirty(); $('#ans-' + i).innerHTML = answerEditor(q, i); },
  fillCombo: async el => { const i = Number(el.dataset.q), q = state.edit.content.questions[i]; if (q.choices.some(c => c.trim()) && !(await confirmBox('いまの選択肢を置きかえますか？', '置きかえる'))) return; q.choices = ['a－正　b－正', 'a－正　b－誤', 'a－誤　b－正', 'a－誤　b－誤']; q.answerIndex = -1; markDirty(); $('#ans-' + i).innerHTML = answerEditor(q, i); },
  addQ: () => { const qs = state.edit.content.questions; qs.push(CORE.newQuestion()); markDirty(); renderEditor(); jumpQ(qs.length); },
  delQ: async el => { const i = Number(el.dataset.q); if (!(await confirmBox('問' + (i + 1) + 'を消しますか？', '消す', true))) return; state.edit.content.questions.splice(i, 1); markDirty(); renderEditor(); },
  moveQ: el => { const i = Number(el.dataset.q), d = Number(el.dataset.dir), qs = state.edit.content.questions; const t = qs[i]; qs[i] = qs[i + d]; qs[i + d] = t; markDirty(); renderEditor(); jumpQ(i + d + 1); },
  delImg: el => { const ed = state.edit, t = el.dataset.target, k = Number(el.dataset.k); const arr = t === 'lead' ? ed.content.leadImages : ed.content.questions[Number(t.slice(1))].images; arr.splice(k, 1); markDirty(); if (t === 'lead') renderEditor(); else rerenderQ('questions.' + t.slice(1)); },
  jumpQ: el => jumpQ(Number(el.dataset.q)),
  save: () => saveEdit(false),
  check: () => runCheck(),
  publish: async () => {
    const ed = state.edit;
    const miss = CORE.completeness(CORE.normalizeContent(ed.content));
    if (miss.length) return showMissing(miss, '公開');
    const r = ed.lastCheck, stale = edStale(ed);
    let note = '';
    if (!r) note = 'まだAIチェックを受けていません（受けなくても公開できます）。\n';
    else if (stale) note = 'AIチェックのあとで内容を変えています。\n';
    else if (r.verdict !== 'pass') note = 'AIから「確かめてほしい点」が ' + r.issues.filter(x => x.level === 'must').length + ' つ出ています。自分で確かめて納得していれば公開してかまいません。\n';
    if (await confirmBox(note + '公開しますか？クラスのみんなが解けるようになります。\n公開中は編集できません（「修正する」でいったん非公開にできます）。', '公開する')) runPublish('');
  },
  appeal: () => openAppeal(),
  preview: () => openPreview(CORE.normalizeContent(state.edit.content)),
  // 自分の問題ページ
  previewMine: () => openPreview(state.detail.content, '問題（正解・解説つき）'),
  withdraw: async () => {
    const p = state.detail;
    const msg = p.status === 'published' ? 'いったん非公開にして修正しますか？\n直したあと、もう一度AIチェックを受けて公開します。これまでの解答結果は前の版として残ります。' : '提出を取り下げて、下書きに戻しますか？';
    if (!(await confirmBox(msg, p.status === 'published' ? '非公開にして修正する' : '取り下げる'))) return;
    try { await api('withdrawProblem', { id: p.id }); state.edit = null; go('#/edit/' + p.id); } catch (e) { toastErr(e); }
  },
  deleteMine: async () => { if (!(await confirmBox('この問題を消しますか？元に戻せません。', '消す', true))) return; try { await api('deleteProblem', { id: state.detail.id }); toast('消しました'); go('#/mine'); } catch (e) { toastErr(e); } },
  // 解く
  submitAnswers: () => submitAnswers(),
  selfScore: el => { const S = state.solve, i = Number(el.dataset.q); S.self[i] = Number(el.dataset.v); $$(`[data-act="selfScore"][data-q="${i}"]`).forEach(b => b.classList.toggle('on', b === el)); $('#live-total').textContent = n1(liveTotal()); },
  aiEssay: el => aiEssay(Number(el.dataset.q)),
  rate: el => { state.solve.rating = Number(el.dataset.v); $$('.stars button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) <= state.solve.rating)); },
  finishAttempt: () => finishAttempt(),
  retake: () => { state.solve.retake = true; renderSolve(); window.scrollTo(0, 0); },
  // 先生
  tLogout: () => { state.pass = null; SS.del('sakumon-pass'); go('#/'); },
  tRefresh: () => viewTList(),
  tAsStudent: () => {
    const s = state.settings;
    const m = openModal(`<h3>テスト生徒で生徒の画面を見る</h3>
      <p style="font-size:14.5px">「テスト生徒（先生）」として生徒の画面に入ります。授業でのデモや動作の確認に使えます。<b>解いた結果は正答率・平均点などの集計に入りません。</b>テストで作った問題は、提出状況に「テスト」と表示されるので、終わったら削除できます。</p>
      <label class="f"><span class="lbl">どのクラスの生徒として見ますか</span><select id="as-class">${s.classes.map(c => `<option>${esc(c)}</option>`).join('')}</select></label>
      <div class="foot"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn" id="as-go">生徒の画面へ</button></div>`);
    $('#as-go', m).addEventListener('click', () => {
      LS.set('sakumon-me', { class: $('#as-class', m).value, number: '0', name: 'テスト生徒（先生）', test: true });
      location.href = location.pathname;
    });
  },
  endTest: () => { LS.del('sakumon-me'); state.me = null; location.href = teacherUrl(); },
  tOpen: el => go('#/t/' + el.dataset.id),
  tSettings: () => openTSettings(),
  tQR: () => openQR(),
  tCSV: () => downloadCSV(),
  tPublish: async () => { if (await confirmBox('この問題を公開しますか？', '公開する')) { const r = await tAction('tSetStatus', { op: 'publish' }, '公開しました'); if (r) viewTProblem(state.t.detail.id); } },
  tUnpublish: async () => { if (await confirmBox('非公開に戻しますか？（生徒は下書きとして直せるようになります）', '非公開にする')) { const r = await tAction('tSetStatus', { op: 'unpublish' }, '非公開にしました'); if (r) viewTProblem(state.t.detail.id); } },
  tReturn: () => {
    const m = openModal(`<h3>差し戻す</h3><p style="font-size:14.5px">生徒の画面に表示されるコメントを書いてください。</p><textarea id="ret-note" rows="4" placeholder="例）問2の選択肢③も正解になりえます。教科書p.〇〇を確認して直そう。"></textarea><div class="foot"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn red" id="ret-go">差し戻す</button></div>`);
    $('#ret-go', m).addEventListener('click', async () => { const note = $('#ret-note', m).value; m.remove(); const r = await tAction('tSetStatus', { op: 'return', note }, '差し戻しました'); if (r) viewTProblem(state.t.detail.id); });
  },
  tDelete: async () => { if (!(await confirmBox('この問題と、解答の記録をすべて削除しますか？元に戻せません。', '削除する', true))) return; const r = await tAction('tDelete', {}, '削除しました'); if (r) go('#/'); },
  tGrade: el => { $$('#t-grade .pick').forEach(b => b.classList.toggle('on', b === el && !b.classList.contains('on'))); },
  tSaveEval: async () => { const g = $('#t-grade .pick.on'); const r = await tAction('tEvaluate', { evaluation: { grade: g ? g.dataset.v : '', score: $('#t-score').value, comment: $('#t-comment').value } }, '評価を保存しました'); if (r) state.t.detail.teacherEval = r.problem.teacherEval; }
};
document.addEventListener('click', e => {
  const img = e.target.closest('.fig img, .img-ed img');
  if (img && img.src) { openModal(`<img src="${img.src}" alt="">`, { cls: 'lightbox' }); return; }
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
  ACT[el.dataset.act](el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio' || el.type === 'file') return; // change で処理
  if (el.dataset && el.dataset.bind != null && state.edit) return onBindInput(el);
  if (el.classList && el.classList.contains('essay-in')) {
    autoGrow(el);
    const c = $(`[data-cnt="${el.dataset.ans}"]`), lim = Number(c.dataset.limit);
    c.textContent = countText(el.value, lim); c.classList.toggle('over', lim > 0 && el.value.replace(/\n/g, '').length > lim);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.file) return addImageFrom(el);
  if (el.dataset.bind != null && state.edit && el.tagName === 'SELECT') return onBindInput(el);
  if (el.dataset.f != null) { state.filters[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; return renderPList(); }
  if (el.dataset.tf != null) { state.t.filters[el.dataset.tf] = el.type === 'checkbox' ? el.checked : el.value; return renderTList(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const bgs = $$('.modal-bg'); if (bgs.length && !bgs[bgs.length - 1].querySelector('[data-r]')) bgs[bgs.length - 1].remove(); } });

// ---------------------------------------------------------------------
//  はじめ
// ---------------------------------------------------------------------
(async function start() {
  if (TEACHER) document.body.classList.add('wide');
  renderTop();
  try {
    const r = await api('config');
    state.settings = r.settings; state.aiReady = r.aiReady;
    if (state.me && state.settings.classes.indexOf(state.me.class) < 0) { state.me = null; LS.del('sakumon-me'); }
  } catch (e) { toast('設定を読み込めませんでした：' + e.message, true); }
  route();
})();
